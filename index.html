<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indus110 Gaming Platform</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 15px; }
        h1 { text-align: center; color: #38bdf8; font-size: 20px; margin-bottom: 10px; }
        .user-info { background: #1e293b; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 13px; color: #cbd5e1; border: 1px solid #334155; }
        .banner { background: linear-gradient(135deg, #3b82f6, #1d4ed8); padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 15px; font-size: 13px; font-weight: bold; }
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; justify-content: center; padding-bottom: 5px; }
        .tab-btn { background: #1e293b; color: #cbd5e1; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; white-space: nowrap; }
        .tab-btn.active { background: #3b82f6; color: white; font-weight: bold; }
        
        #games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .game-card { background: #1e293b; border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; border: 1px solid #334155; transition: 0.2s; }
        .game-card:hover { border-color: #3b82f6; transform: translateY(-2px); }
        .game-icon { background: #334155; height: 55px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 8px; }
        .game-card h4 { font-size: 13px; margin: 4px 0; color: #f8fafc; }
        .game-card p { font-size: 11px; color: #94a3b8; margin: 0 0 6px 0; }
        .badge { background: #22c55e; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>

    <h1>Indus110 Gaming</h1>
    
    <!-- Telegram User Profile Banner -->
    <div id="user-profile" class="user-info">Initializing app...</div>

    <!-- Promo Banner -->
    <div class="banner">
        🎁 Enjoy Daily Bonus & Get 800 PKR per Referral!
    </div>

    <!-- Category Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="filterCategory('Hot', this)">🔥 Hot Hub</button>
        <button class="tab-btn" onclick="filterCategory('All', this)">🎮 All Games</button>
        <button class="tab-btn" onclick="filterCategory('Favorites', this)">⭐ Favorites</button>
    </div>

    <!-- Games Grid Container -->
    <div id="games-grid">Loading games...</div>

    <script>
        // 1. Telegram User Initialization safely
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
                if (tgUser && tgUser.id) {
                    document.getElementById('user-profile').innerHTML = `Welcome, <b>${tgUser.first_name || 'Player'}</b>`;
                } else {
                    document.getElementById('user-profile').innerHTML = `Welcome, <b>Guest Player</b> (Telegram WebApp)`;
                }
            } else {
                document.getElementById('user-profile').innerHTML = `Welcome, <b>Browser User</b>`;
            }
        } catch (e) {
            document.getElementById('user-profile').innerHTML = `Welcome, <b>Player</b>`;
        }

        // 2. Supabase Setup & Fetch
        const SUPABASE_URL = 'https://rnmjchixmiyqhciafsfk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJubWpjaGl4bWl5cWhjaWFmc2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NTA2MjAsImV4cCI6MjEwNjUyNjYyMH0.C_ics2YhbhaJjFHG38RV_wJROmgfUhLldqGeZdpv76Q';
        
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
            console.error("Supabase init error:", err);
        }

        async function fetchGames(category = 'Hot') {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">Fetching catalog...</p>';

            if (!supabaseClient) {
                grid.innerHTML = '<p style="color: red; text-align: center;">Database connection failed.</p>';
                return;
            }

            try {
                const { data: games, error } = await supabaseClient
                    .from('games')
                    .select('*')
                    .eq('is_active', true)
                    .eq('category', category);

                if (error) throw error;

                grid.innerHTML = '';

                if (!games || games.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">No games found in this category.</p>';
                    return;
                }

                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <div class="game-icon">🎰</div>
                        <h4>${game.game_name}</h4>
                        <p>${game.provider}</p>
                        <span class="badge">Win Ratio: ${game.win_ratio}%</span>
                    `;
                    card.onclick = () => window.open(game.launcher_url, '_blank');
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error('Error fetching games:', err.message);
                grid.innerHTML = `<p style="color: red; text-align: center;">Error: ${err.message}</p>`;
            }
        }

        function filterCategory(category, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchGames(category);
        }

        // Initial load
        fetchGames('Hot');
    </script>
</body>
</html>
